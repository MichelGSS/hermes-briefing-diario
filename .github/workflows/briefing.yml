name: Briefing diário (política e cripto)

on:
  schedule:
    # Todo dia às 10:17 UTC = 07:17 em Brasília (UTC-3).
    # Minuto "quebrado" de propósito: horários cheios atrasam mais no GitHub.
    - cron: "17 10 * * *"
  workflow_dispatch: # botão "Run workflow" para rodar na hora (ex.: na entrevista)

# Privilégio mínimo: os jobs só precisam ler o próprio repositório.
permissions:
  contents: read

concurrency:
  group: briefing
  cancel-in-progress: false

# As actions de terceiros estão fixadas pelo commit (SHA), não pela tag.
# Uma tag pode ser movida por quem controla o repositório da action; um SHA não.

jobs:
  # JOB 1: coleta + IA. Roda código de terceiros (instalador e Hermes)
  # e por isso NUNCA recebe a senha do email.
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # não deixa o token do GitHub gravado em disco

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Etapa 1, sem IA: coleta títulos e links dos feeds RSS.
      - name: Coletar manchetes
        run: |
          python scripts/fetch_news.py \
            --feeds feeds.txt \
            --template prompts/briefing.txt \
            --hours 24 \
            --out prompt.txt

      # Etapa 2: instala o Hermes Agent pelo instalador oficial.
      - name: Instalar Hermes Agent
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh -o "$RUNNER_TEMP/install.sh"
          echo "SHA-256 do instalador (para auditoria):"
          sha256sum "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh" < /dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configurar Hermes e a skill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.hermes/skills/briefing-diario
          cp hermes/config.yaml ~/.hermes/config.yaml
          cp skills/briefing-diario/SKILL.md ~/.hermes/skills/briefing-diario/SKILL.md
          umask 077
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > ~/.hermes/.env
          hermes --version

      # Etapa 3: o agente só resume. Sem terminal e sem web (--toolsets skills).
      #
      # O Gemini gratuito às vezes responde 503 ("muita demanda") ou 429 (cota).
      # Por isso o passo tenta uma lista de modelos, em ordem, e repete a lista
      # até 3 vezes com pausa entre as rodadas. Antes de chamar o Hermes, uma
      # chamada curta confere se o modelo está respondendo naquele momento.
      - name: Gerar briefing com o Hermes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELOS: "gemini-flash-latest gemini-3.7-flash gemini-2.5-flash gemini-3.5-flash-lite"
        run: |
          testar() {
            curl -sS -o gemini_test.json -w '%{http_code}' \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"Responda apenas: ok"}]}]}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$1:generateContent" || echo 000
          }
          erro() {
            python -c "import json; e=json.load(open('gemini_test.json')).get('error', {}); print('   ', e.get('status'), '-', (e.get('message') or '')[:160])" 2>/dev/null || true
          }

          ok=0
          for rodada in 1 2 3; do
            for modelo in $MODELOS; do
              code=$(testar "$modelo")
              case "$code" in
                200) ;;
                400|401|403)
                  echo "Rodada $rodada · $modelo: HTTP $code, problema na chave da API. Não adianta tentar de novo."
                  erro
                  exit 1 ;;
                *)
                  echo "Rodada $rodada · $modelo: indisponível agora (HTTP $code), pulando."
                  erro
                  continue ;;
              esac

              echo "Rodada $rodada · $modelo: respondendo, gerando o briefing..."
              status=0
              timeout 900 hermes chat --oneshot --quiet \
                --model "$modelo" \
                --skills briefing-diario \
                --toolsets skills \
                --max-turns 5 \
                --query-file prompt.txt \
                < /dev/null > digest.txt 2> hermes_stderr.log || status=$?

              if [ "$status" = "0" ] && [ -s digest.txt ]; then
                echo "Briefing gerado com $modelo."
                ok=1
                break 2
              fi
              echo "Falhou com $modelo (código $status; 124 = passou de 15 minutos). Últimas linhas do Hermes:"
              tail -n 20 hermes_stderr.log || true
            done
            if [ "$rodada" -lt 3 ]; then
              echo "Nenhum modelo deu certo nesta rodada. Aguardando 3 minutos..."
              sleep 180
            fi
          done

          if [ "$ok" != "1" ]; then
            echo "Nenhum modelo funcionou depois de 3 rodadas."
            echo "----- logs do Hermes -----"
            tail -n 80 ~/.hermes/logs/*.log 2>/dev/null || true
            exit 1
          fi
          echo "----- briefing gerado -----"
          cat digest.txt

      # Passa para o job de envio só o texto do briefing e a lista de links
      # coletados (o prompt). Nenhum segredo vai junto.
      - name: Guardar o briefing para o envio
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: briefing
          path: |
            digest.txt
            prompt.txt
          retention-days: 1

  # JOB 2: envio. Roda numa máquina NOVA, onde o Hermes nunca foi instalado.
  # Só aqui existe a senha do email.
  enviar:
    needs: gerar
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Receber o briefing
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: briefing

      # Etapa 4: confere os links e envia. Python do sistema, sem dependências.
      - name: Enviar email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: /usr/bin/python3 scripts/send_email.py digest.txt --allowed-links prompt.txt
